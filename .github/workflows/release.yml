name: Build, Release, and Attest Assets

on:
  push:
    tags:
      - '*.*.*'   # Triggers if you tag exactly like: 2.23.0 or 2.23.0-beta-1
      - 'v*.*.*'  # Triggers if you tag like: v2.23.0 or v2.23.0-beta-1

jobs:
  release:
    name: Create Release and Attest Assets
    runs-on: ubuntu-latest
    env:
      FLUX_CORE_COMMIT: e3ad867ec85075c259810aa07bd36971f8302d05

    # CRITICAL: Give GitHub the required permissions to sign your files
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      # 1. Pull down your repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # Keep the Release tag and the plugin manifest in lockstep. BRAT uses the
      # Release tag as the authoritative installed version.
      - name: Verify release version
        run: |
          node -e 'const manifest=require("./manifest.json"); if (manifest.version !== process.env.GITHUB_REF_NAME) { throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match manifest ${manifest.version}`); }'

      # 2. Tell the server to install Node 22
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 3. Install plugin dependencies from the lockfile. The published Core
      # package is only a bootstrap; the pinned open-source Flux Core below
      # replaces its four Obsidian consumer artifacts before plugin bundling.
      - name: Install plugin dependencies
        run: npm ci

      - name: Build pinned Excalidraw Flux Core
        run: |
          core_dir="$RUNNER_TEMP/excalidraw-flux-core"
          git init "$core_dir"
          git -C "$core_dir" remote add origin https://github.com/atseis/excalidraw-flux-core.git
          git -C "$core_dir" fetch --depth 1 origin "$FLUX_CORE_COMMIT"
          git -C "$core_dir" checkout --detach FETCH_HEAD
          corepack yarn --cwd "$core_dir" install --frozen-lockfile
          corepack yarn --cwd "$core_dir/packages/excalidraw" build:obsidian

          core_dist="$core_dir/packages/excalidraw/dist/obsidian"
          installed_dist="node_modules/@zsviczian/excalidraw/dist/obsidian"
          for artifact in \
            excalidraw.production.min.js \
            excalidraw.production.min.css \
            excalidraw.development.js \
            excalidraw.development.css
          do
            cp "$core_dist/$artifact" "$installed_dist/$artifact"
          done

      # This generates dist/manifest.json from the stable manifest and embeds
      # the freshly built, pinned Flux Core artifacts.
      - name: Build plugin assets
        run: npm run build

      # 4. Flux stable versions contain "-flux". Only explicit preview channel
      # tags are GitHub prereleases, because BRAT excludes prereleases when a
      # user selects the latest version.
      - name: Determine if Pre-release
        id: check-prerelease
        run: |
          case "${{ github.ref_name }}" in
            *-alpha*|*-beta*|*-rc*) echo "is_prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # 5. Swap to the Beta Manifest if it's a pre-release
      - name: Prepare Beta Manifest
        if: steps.check-prerelease.outputs.is_prerelease == 'true'
        run: |
          echo "Pre-release detected! Swapping dist/manifest.json with manifest-beta.json..."
          cp manifest-beta.json dist/manifest.json

      # 6. Generate the cryptographic attestations for your built files
      # (Because this runs AFTER step 5, it will correctly sign the beta manifest!)
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      # 7. Automatically create a GitHub Release and attach the files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/main.js
            dist/styles.css
            dist/manifest.json
          # Dynamically set pre-release based on step 4
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
